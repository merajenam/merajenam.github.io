<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meraj Enam — Marketing Intelligence</title>
  <meta name="description" content="M.S. Marketing Intelligence graduate — building brands, growing communities, and turning data into decisions." />
  <meta property="og:title" content="Meraj Enam — Portfolio" />
  <meta property="og:description" content="Co-founder of AlterYouth. Marketing analyst, UI designer, data storyteller." />
  <meta property="og:type" content="website" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>* { box-sizing: border-box; margin: 0; padding: 0; } body { background: #000; overflow-x: hidden; } #root { min-height: 100vh; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;


function useBreakpoint() {
  const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return { isMobile: w < 600, isTablet: w >= 600 && w < 1024 };
}

const DARK = {
  bg: "#000", bg2: "#0d0d0d", bg3: "#111", bg4: "#1c1c1e",
  input: "#1c1c1e", blueBg: "#0a1929", recBg: "#1c1c1e",
  text: "#f5f5f7", text2: "#a1a1a6", text3: "#6e6e73", text4: "#3a3a3c",
  border: "rgba(255,255,255,0.08)", border2: "rgba(255,255,255,0.06)",
  navBg: "#000", menuBg: "rgba(0,0,0,0.97)",
};
const LIGHT = {
  bg: "#fff", bg2: "#f5f5f7", bg3: "#fff", bg4: "#e8e8ed",
  input: "#f0f0f5", blueBg: "#e8f0fd", recBg: "#e8e8ed",
  text: "#1d1d1f", text2: "#515154", text3: "#86868b", text4: "#aeaeb2",
  border: "rgba(0,0,0,0.08)", border2: "rgba(0,0,0,0.05)",
  navBg: "rgba(255,255,255,0.95)", menuBg: "rgba(255,255,255,0.97)",
};

const css = `
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { overflow-x: hidden; }

  .skill-card { transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease; }
  .skill-card:hover { border-color: rgba(41,151,255,0.45) !important; transform: translateY(-3px); box-shadow: 0 12px 32px rgba(41,151,255,0.1); }
  .skill-tag { cursor: default; }
  .proj-card { transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease; }
  .proj-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); border-color: rgba(41,151,255,0.35) !important; }
  .nav-a { transition: color 0.2s ease, transform 0.15s ease; display: inline-block; text-decoration: none; cursor: pointer; color: #a1a1a6; }
  .nav-a:hover { color: #2997ff !important; transform: translateY(-1px); }
  .btn-p { transition: background 0.2s ease, transform 0.15s ease; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn-p:hover { background: #0077ed !important; transform: translateY(-1px); }
  .btn-s { transition: background 0.2s ease, transform 0.15s ease; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn-s:hover { background: rgba(41,151,255,0.08) !important; transform: translateY(-1px); }

  .crow { border-radius: 8px; padding: 4px 6px; margin: -4px -6px; }
  .cbox { transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
  .crow:hover .cbox { background: rgba(41,151,255,0.15) !important; border-color: rgba(41,151,255,0.4) !important; box-shadow: 0 0 10px rgba(41,151,255,0.2); }

  .theme-btn {
    display: flex; align-items: center; gap: 5px;
    border-radius: 980px; padding: 5px 12px;
    cursor: pointer; font-family: inherit; font-size: 12px;
    transition: all 0.2s ease; border: none;
  }

  .mmenu {
    position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
    z-index: 99; display: flex; flex-direction: column; padding: 2rem;
    animation: fi 0.18s ease forwards; backdrop-filter: blur(20px);
  }
  @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
  .mmlink {
    font-size: 28px; font-weight: 600; padding: 0.85rem 0;
    letter-spacing: -0.03em; transition: color 0.15s ease; cursor: pointer;
  }
  input, textarea, button { font-family: inherit; }
  input:focus, textarea:focus { outline: none; border-color: #2997ff !important; }
  @media (max-width: 599px) {
    .skill-card:hover, .proj-card:hover, .btn-p:hover, .btn-s:hover { transform: none !important; }
  }
`;

const BarChart = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2997ff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="10"/></svg>;
const TrendUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2997ff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 18 8.5 10.5 13.5 15.5 23 6"/><polyline points="17 6 23 6 23 12"/></svg>;
const PenTool = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2997ff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>;
const MenuIco = ({ c }) => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.5" strokeLinecap="round"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>;
const CloseIco = ({ c }) => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
const MailIco = ({ lit }) => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ stroke: lit ? "#60b4ff" : "#2997ff", transition: "stroke 0.2s" }}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
const LIIco = ({ lit }) => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ stroke: lit ? "#60b4ff" : "#2997ff", transition: "stroke 0.2s" }}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>;
const GlobeIco = ({ lit }) => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ stroke: lit ? "#60b4ff" : "#2997ff", transition: "stroke 0.2s" }}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;

function CRow({ icon, label, href, dark }) {
  const [hov, setHov] = useState(false);
  return (
    <div className="crow" style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 14, marginBottom: "0.75rem" }}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}>
      <div className="cbox" style={{ width: 32, height: 32, borderRadius: 8, background: dark ? "#111" : "transparent", border: dark ? "0.5px solid rgba(255,255,255,0.08)" : "0.5px solid rgba(41,151,255,0.4)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
        {icon(hov)}
      </div>
      <a href={href} target="_blank" rel="noreferrer" style={{ color: hov ? "#60b4ff" : "#2997ff", textDecoration: "none", transition: "color 0.2s", wordBreak: "break-all" }}>{label}</a>
    </div>
  );
}

function Portfolio() {
  const { isMobile, isTablet } = useBreakpoint();
  const [dark, setDark] = useState(true);
  const [menuOpen, setMenuOpen] = useState(false);

  const C = dark ? DARK : LIGHT;
  const gx = isMobile ? "1.25rem" : isTablet ? "2rem" : "3rem";
  const gy = isMobile ? "3rem" : isTablet ? "3.5rem" : "4.5rem";
  const maxW = 1140;
  const wrap = { maxWidth: maxW, margin: "0 auto", padding: `${gy} ${gx}` };
  const H1 = isMobile ? 38 : isTablet ? 44 : 54;
  const H2 = isMobile ? 22 : 30;

  const scrollTo = id => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  const NAV = [["About","about"],["Skills","skills"],["Experience","experience"],["Projects","projects"],["Education","education"],["Contact","contact"]];

  const sec = (id, children, last) => (
    <section id={id} style={{ borderBottom: last ? "none" : `0.5px solid ${C.border}`, background: C.bg, transition: "background 0.3s" }}>
      {children}
    </section>
  );

  const eye = txt => <p style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: "#2997ff", marginBottom: "0.5rem" }}>{txt}</p>;
  const stt = txt => <p style={{ fontSize: H2, fontWeight: 600, marginBottom: "2rem", color: C.text, letterSpacing: "-0.03em" }}>{txt}</p>;
  const grp = txt => <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase", color: C.text3, marginBottom: "1.25rem", marginTop: "2.25rem", paddingBottom: "0.5rem", borderBottom: `0.5px solid ${C.border}` }}>{txt}</div>;

  const exp = ({ period, org, href, children, last }) => (
    <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "160px 1fr", gap: isMobile ? "0.25rem" : "2.5rem", marginBottom: last ? 0 : "2rem", paddingBottom: last ? 0 : "2rem", borderBottom: last ? "none" : `0.5px solid ${C.border2}` }}>
      <div style={{ textAlign: isMobile ? "left" : "right" }}>
        <span style={{ fontSize: 13, color: C.text2, fontWeight: 300 }}>{period}</span>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#2997ff", marginTop: isMobile ? 1 : 4 }}>
          {href ? <a href={href} target="_blank" rel="noreferrer" style={{ color: "#2997ff", textDecoration: "none" }}>{org} ↗</a> : org}
        </div>
      </div>
      <div style={{ marginTop: isMobile ? "0.5rem" : 0 }}>{children}</div>
    </div>
  );

  const tagStyle = (size = 10) => ({
    fontSize: size,
    padding: "4px 11px",
    borderRadius: 980,
    border: "0.5px solid rgba(41,151,255,0.35)",
    color: dark ? "#e0eeff" : "#0055b3",
    background: dark ? "rgba(41,151,255,0.12)" : "rgba(41,151,255,0.1)",
    fontWeight: 500,
    cursor: "default",
  });

  const tags = (list, style) => (
    <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginTop: "0.6rem", ...style }}>
      {list.map(t => <span key={t} className="skill-tag" style={tagStyle(12)}>{t}</span>)}
    </div>
  );

  const bullets = list => (
    <ul style={{ margin: "0 0 0.75rem", padding: 0, listStyle: "none" }}>
      {list.map((item, i) => (
        <li key={i} style={{ fontSize: 13, color: C.text2, lineHeight: 1.65, fontWeight: 300, paddingLeft: 16, position: "relative", marginBottom: 6 }}>
          <span style={{ position: "absolute", left: 2, color: "#2997ff", fontWeight: 700, fontSize: 16, lineHeight: 1.3 }}>·</span>
          {item}
        </li>
      ))}
    </ul>
  );

  const proj = ({ badge, title, context, link, featured, children }) => (
    <div className="proj-card" style={{ background: C.bg3, border: `0.5px solid ${featured ? "#2997ff" : C.border}`, borderRadius: 14, padding: "1.25rem", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "0.4rem" }}>
        <p style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em", color: featured ? "#2997ff" : C.text2 }}>{badge}</p>
        {link && <a href={link} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: "#2997ff", textDecoration: "none", border: "0.5px solid #2997ff", padding: "2px 8px", borderRadius: 980, flexShrink: 0 }}>Visit ↗</a>}
      </div>
      <h3 style={{ fontSize: 15, fontWeight: 600, marginBottom: "0.35rem", color: C.text, lineHeight: 1.3 }}>{title}</h3>
      {context && <p style={{ fontSize: 12, color: C.text3, marginBottom: "0.5rem" }}>{context}</p>}
      {children}
    </div>
  );

  const H3 = { fontSize: 15, fontWeight: 600, marginBottom: "0.4rem", color: C.text };
  const BD = { fontSize: 14, color: C.text2, lineHeight: 1.75, fontWeight: 300 };

  return (
    <div style={{ fontFamily: "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif", color: C.text, background: C.bg, fontSize: 16, lineHeight: 1.6, WebkitFontSmoothing: "antialiased", transition: "background 0.3s, color 0.3s" }}>
      <style>{css}</style>

      {/* NAV */}
      <nav style={{ borderBottom: `0.5px solid ${C.border}`, position: "sticky", top: 0, background: C.navBg, zIndex: 100, backdropFilter: "blur(20px)", transition: "background 0.3s" }}>
        <div style={{ maxWidth: maxW, margin: "0 auto", padding: `0 ${gx}`, height: 48, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 15, fontWeight: 600, color: C.text, letterSpacing: "-0.02em" }}>Meraj Enam</span>
          <div style={{ display: "flex", alignItems: "center", gap: "1rem" }}>
            {!isMobile && (
              <div style={{ display: "flex", gap: isTablet ? "1.25rem" : "2rem" }}>
                {NAV.map(([label, id]) => (
                  <a key={id} onClick={() => scrollTo(id)} className="nav-a" style={{ fontSize: isTablet ? 12 : 13, color: C.text2 }}>{label}</a>
                ))}
              </div>
            )}
            <button onClick={() => setDark(d => !d)} className="theme-btn"
              style={{ background: C.bg4, border: `0.5px solid ${C.border}`, color: C.text2 }}>
              <span style={{ fontSize: 14 }}>{dark ? "☀️" : "🌙"}</span>
              {!isMobile && <span style={{ fontSize: 12 }}>{dark ? "Light" : "Dark"}</span>}
            </button>
            {isMobile && (
              <button onClick={() => setMenuOpen(o => !o)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, display: "flex" }}>
                {menuOpen ? <CloseIco c={C.text2} /> : <MenuIco c={C.text2} />}
              </button>
            )}
          </div>
        </div>
      </nav>

      {menuOpen && (
        <div className="mmenu" style={{ background: C.menuBg }}>
          {NAV.map(([label, id]) => (
            <span key={id} onClick={() => { scrollTo(id); setMenuOpen(false); }} className="mmlink" style={{ color: C.text3, borderBottom: `0.5px solid ${C.border2}` }}>{label}</span>
          ))}
        </div>
      )}

      {/* HERO + ABOUT */}
      {sec("about", (
        <div style={wrap}>
          {/* Hero — full width */}
          <div style={{ marginBottom: isMobile ? "2.5rem" : "3.5rem" }}>
            <p style={{ fontSize: 15, color: C.text2, fontWeight: 300, marginBottom: "0.5rem" }}>👋 Hi, I'm</p>
            <h1 style={{ fontSize: H1, lineHeight: 1.05, fontWeight: 600, color: C.text, marginBottom: "1rem", letterSpacing: "-0.04em" }}>Meraj Enam.</h1>
            <p style={{ fontSize: 15, color: C.text2, maxWidth: 560, lineHeight: 1.8, marginBottom: "1.25rem", fontWeight: 300 }}>M.S. Marketing Intelligence graduate — building brands, growing communities, and turning data into decisions.</p>
            <p style={{ fontSize: 14, color: C.text2, marginBottom: "1.75rem", fontWeight: 300, lineHeight: 1.7 }}>
              <span style={{ color: C.text, fontWeight: 500 }}>Co-founder, AlterYouth</span> · Graduate Assistant · UI Designer · Marketing Analyst
            </p>
            <div style={{ display: "flex", gap: "0.75rem", flexWrap: "wrap" }}>
              <a onClick={() => scrollTo("contact")} className="btn-p" style={{ background: "#2997ff", color: "#fff", padding: "11px 24px", borderRadius: 980, fontSize: 14, fontWeight: 500 }}>Get in touch ↗</a>
              <a onClick={() => scrollTo("projects")} className="btn-s" style={{ background: "transparent", color: "#2997ff", border: "0.5px solid #2997ff", padding: "11px 24px", borderRadius: 980, fontSize: 14, fontWeight: 400 }}>View projects</a>
            </div>
          </div>

          <div style={{ borderTop: `0.5px solid ${C.border2}`, marginBottom: isMobile ? "2rem" : "2.5rem" }} />

          {/* Story + photo side by side */}
          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 0.85fr", gap: isMobile ? "2rem" : "4rem", alignItems: "start" }}>
            <div>
              <p style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: "#2997ff", marginBottom: "1.25rem" }}>My story</p>
              {[
                "Growing up in Bangladesh, I saw something that didn't add up. Primary school was free, but kids kept dropping out. Not because they didn't want to learn — because their families needed them to work. The cost wasn't tuition. It was the cost of not working.",
                null,
                "That's how AlterYouth started. Fifteen dollars to replace what a child would earn working. Families could choose school over income. Strangers from across the world started supporting kids. One subscription at a time, desks filled back up.",
                "Building it taught me that the best marketing isn't about selling — it's about making someone feel the problem the way you do. From there, I learned how communities grow, how stories move people to act, and what the data actually shows beneath the surface. That mix — storytelling, community building, and rigorous analysis — is what I bring to the table.",
              ].map((p, i) => (
                <p key={i} style={{ fontSize: isMobile ? 14 : 15, color: C.text, lineHeight: 1.9, marginBottom: "1.25rem", fontWeight: 300 }}>
                  {p === null ? <>I kept coming back to one question: <em style={{ color: "#2997ff", fontStyle: "normal" }}>what if they could just stay in school?</em> The gap between a kid working and a kid learning was fifteen dollars a month.</> : p}
                </p>
              ))}
            </div>
